# values-staging.yaml: ambiente "staging" (namespace sa-p8-staging,
# creado por P8/terraform). Es el UNICO archivo (junto con
# values-prod.yaml) que el job "gitops-pr" del pipeline
# (.github/workflows/p8-gitops.yml) edita automaticamente -- cada build
# exitoso abre un Pull Request contra este archivo cambiando
# "<servicio>.image.tag" al nuevo tag publicado, y ese PR se auto-mergea
# en staging. Nadie mas edita este archivo a mano.
#
# Perfil de recursos angosto (igual criterio que P6 values-dev.yaml):
# menos CPU/memoria en reposo, HPA con techo mas bajo -- se itera rapido,
# no es el ambiente que "importa" para la calificacion en vivo.

identidad:
  image:
    repository: docker.io/wvasquezusac/sa-platform-identidad-service
    tag: "ci-4b3d4a6d1d25"
  hpa:
    minReplicas: 1
    maxReplicas: 3
  resources:
    requests: {cpu: 30m, memory: 128Mi}
    limits: {cpu: 200m, memory: 256Mi}
tickets:
  # Practica 10 -- FALLO INDUCIDO A (demostracion del canary por metricas):
  # simula una version con una regresion de rendimiento al crear tickets
  # (+1200 ms, ver P6/tickets-service/src/infrastructure/repositories/
  # LatenciaInducidaTicketRepository.ts). /health y /ready siguen en 200:
  # solo el analisis por metricas (latencia-p95) puede detectarla.
  configMap:
    data:
      FALLO_LATENCIA_MS: "1200"
  image:
    repository: docker.io/wvasquezusac/sa-platform-tickets-service
    tag: "ci-4b3d4a6d1d25"
  # Practica 9: 2, no 1 -- es uno de los dos servicios con PDB +
  # anti-afinidad para la prueba de perdida de nodo (requiere al menos 2
  # replicas para que la caida de un nodo no sea la caida del servicio).
  # maxReplicas tambien en 2 (no 3): anti-afinidad "required" + 2 nodos
  # worker, un 3er pod se quedaria en Pending para siempre.
  hpa:
    minReplicas: 2
    maxReplicas: 2
  resources:
    requests: {cpu: 30m, memory: 128Mi}
    limits: {cpu: 200m, memory: 256Mi}
asignacion:
  image:
    repository: docker.io/wvasquezusac/sa-platform-asignacion-service
    tag: "ci-4b3d4a6d1d25"
  hpa:
    minReplicas: 1
    maxReplicas: 3
  resources:
    requests: {cpu: 30m, memory: 128Mi}
    limits: {cpu: 200m, memory: 256Mi}
notificaciones:
  image:
    repository: docker.io/wvasquezusac/sa-platform-notificaciones-service
    tag: "ci-4b3d4a6d1d25"
  hpa:
    minReplicas: 1
    maxReplicas: 3
  resources:
    requests: {cpu: 30m, memory: 128Mi}
    limits: {cpu: 200m, memory: 256Mi}
gateway:
  image:
    repository: docker.io/wvasquezusac/sa-platform-gateway
    tag: "ci-4b3d4a6d1d25"
  # Practica 9: 2, no 1 -- mismo motivo que tickets.hpa arriba, y ademas
  # es el punto de entrada usado para verificar con curl que el servicio
  # sigue respondiendo durante el drenaje. maxReplicas tambien en 2, mismo
  # motivo que tickets.hpa.
  hpa:
    minReplicas: 2
    maxReplicas: 2
  resources:
    requests: {cpu: 30m, memory: 128Mi}
    limits: {cpu: 200m, memory: 256Mi}
  ingress:
    host: sa-p8-staging.local
cronjobs:
  heartbeat:
    image:
      repository: docker.io/wvasquezusac/sa-platform-cronjob-heartbeat
      tag: "ci-4b3d4a6d1d25"
  resumen:
    image:
      repository: docker.io/wvasquezusac/sa-platform-cronjob-resumen
      tag: "ci-4b3d4a6d1d25"
