# NetworkPolicies (requisito E): Kubernetes permite todo el trafico por
# defecto (no hay "deny" implicito) -- cada Policy de aqui restringe el
# INGRESO a un componente especifico a solo quien realmente lo necesita.
# Nadie mas que el Ingress Controller puede alcanzar al gateway; nadie mas
# que los microservicios/cronjobs autorizados puede alcanzar a Postgres o
# Kafka; los microservicios internos no se alcanzan entre si salvo las
# llamadas que el diseno realmente usa (ver docs/diagramas/01-arquitectura.md).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-from-authorized
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - identidad-service
                  - tickets-service
                  - asignacion-service
                  - notificaciones-service
                  - cronjob-heartbeat
                  - cronjob-resumen
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-from-authorized
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - tickets-service
                  - notificaciones-service
                  - cronjob-resumen
                  # Job de post-install/post-upgrade que crea los topicos
                  # (ver templates/kafka-topics-job.yaml).
                  - kafka-topics-init
      ports:
        - protocol: TCP
          port: 9092
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-from-ingress-controller
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # ingress-nginx corre en su propio namespace; Kubernetes etiqueta
        # todo namespace automaticamente con kubernetes.io/metadata.name
        # desde 1.21+, no requiere que nosotros lo etiquetemos a mano.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      # Practica 9: el AnalysisTemplate de cada Rollout (entrega
      # progresiva, ver charts/common/templates/_analysis.tpl) prueba
      # /ready contra el Service "-canary" -- ese chequeo lo hace el
      # controlador de Argo Rollouts, no el pod real que consume este
      # servicio. Sin esta regla el canary SIEMPRE aborta (bug latente de
      # P8, nunca ejercitado hasta la primera actualizacion real de un
      # Rollout ya desplegado en P9).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argo-rollouts
        # Practica 10: el generador de trafico de usuarios entra, como un
        # usuario mas, por el gateway (templates/generador-trafico.yaml).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: generador-trafico
      ports:
        - protocol: TCP
          port: 4000
---
