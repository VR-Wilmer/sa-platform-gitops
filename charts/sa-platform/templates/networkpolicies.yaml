---
# Practica 10: Prometheus (namespace observabilidad) scrapea el endpoint de
# metricas del SDK de OpenTelemetry de los 5 servicios. Solo el puerto 9464
# (metricas), nunca el puerto de la aplicacion: el aislamiento de P5-P9 se
# mantiene intacto. Las trazas salen de los pods hacia el Collector
# (trafico de salida), que estas NetworkPolicies -- solo Ingress -- no
# restringen.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-from-observabilidad
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - identidad-service
          - tickets-service
          - asignacion-service
          - notificaciones-service
          - gateway
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observabilidad
      ports:
        - protocol: TCP
          port: 9464
