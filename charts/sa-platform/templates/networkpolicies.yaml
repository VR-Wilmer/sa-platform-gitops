      # controlador de Argo Rollouts, no el pod real que consume este
      # servicio. Sin esta regla el canary SIEMPRE aborta (bug latente de
      # P8, nunca ejercitado hasta la primera actualizacion real de un
      # Rollout ya desplegado en P9).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argo-rollouts
      ports:
        - protocol: TCP
          port: 4100
---
