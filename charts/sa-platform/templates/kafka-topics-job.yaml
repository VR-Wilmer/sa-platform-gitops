# Practica 10: ademas de los hooks de Helm, anotaciones de ArgoCD
# (tienen prioridad sobre las de Helm cuando sincroniza ArgoCD). Como hook
# "PostSync" (traduccion de post-install de Helm) el Job esperaba a que
# TODO estuviera sano, pero notificaciones-service nunca queda sano sin los
# topicos -- interbloqueo real observado al levantar el cluster sa-p10
# desde cero. Como hook "Sync" corre junto con el resto de recursos y
# reintenta (backoffLimit) hasta que Kafka responde.
# Job de Helm hook (post-install/post-upgrade): crea explicitamente los
# topicos Kafka con particiones y retencion declaradas (requisito D: "la
# cola o topico debera ser durable"), en vez de depender de la
# auto-creacion implicita del broker (deshabilitada a proposito en
# kafka.controller.config, ver values.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-topics-init
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topics-init
    spec:
      serviceAccountName: kafka-topics-init
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka-topics-init
          image: "{{ .Values.kafka.image.registry }}/{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Practica 8: sin esto, Kyverno (require-resources) rechaza el
          # Job siempre -- nunca se creaban los topicos por esta razon,
          # ni con helm install a mano en P6/P7 (Kyverno no existia
          # entonces) ni menos aun ahora que si se exige.
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          command:
            - /bin/bash
            - -c
            - |
              set -e
              {{- range .Values.kafkaTopics }}
              echo "Creando topico '{{ .name }}' ({{ .partitions }} particiones, retention.ms={{ .retentionMs }})..."
              kafka-topics.sh --bootstrap-server kafka:9092 \
                --create --if-not-exists \
                --topic {{ .name }} \
                --partitions {{ .partitions }} \
                --replication-factor {{ .replicationFactor }} \
                --config retention.ms={{ .retentionMs }}
              {{- end }}
              echo "Topicos listos:"
              kafka-topics.sh --bootstrap-server kafka:9092 --list
