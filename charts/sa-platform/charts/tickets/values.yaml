nameOverride: "tickets-service"

image:
  repository: p6/tickets-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  port: 4200

replicaCount: 2

# Requests deliberadamente bajos (requisito F): con 50m de request y el HPA
# al 70%, la prueba de carga de k6 cruza el umbral sin necesitar trafico
# masivo -- ver docs/evidencia/06-prueba-carga.md.
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 300m
    memory: 192Mi

probes:
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    # Umbral mas alto que el resto: ademas de Postgres, espera a conectar el
    # productor Kafka antes de aceptar trafico.
    path: /ready
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 40

hpa:
  enabled: true
  minReplicas: 2
  # Practica 9: topado en 2, igual que minReplicas -- con anti-afinidad
  # "required" (ver charts/common/templates/_workload.tpl) y solo 2 nodos
  # worker, un 3er pod nunca podria programarse.
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

# Practica 9: junto con hpa.minReplicas >= 2 y el PDB de arriba, permite
# que el servicio siga respondiendo mientras se drena un nodo (ver
# P9/docs/evidencia/).
antiAffinity:
  enabled: true

# ServiceAccount/Role/RoleBinding: Practica 8 los mueve a Terraform
# (P8/terraform), con el mismo nombre que "common.fullname" -- este chart
# ya no los crea, ver charts/common/templates/_rbac.tpl (eliminado).

ingress:
  enabled: false

configMap:
  data:
    PORT: "4200"
    DB_HOST: "postgres"
    DB_PORT: "5432"
    DB_NAME: "tickets_db"
    AUTHZ_SERVICE_URL: "http://identidad-service:4100"
    AUTHZ_MAX_RETRIES: "3"
    AUTHZ_RETRY_BACKOFF_MS: "300"
    ASIGNACION_SERVICE_URL: "http://asignacion-service:8000"
    KAFKA_BROKERS: "kafka:9092"
    KAFKA_CLIENT_ID: "tickets-service"
    KAFKA_TICKET_EVENTS_TOPIC: "ticket-notificaciones"

# El Secret "tickets-service" (DB_USER, DB_PASSWORD, INTERNAL_SERVICE_SECRET)
# ya no se declara aqui (Practica 8): lo materializa Sealed Secrets a
# partir de sa-platform-gitops/sealed-secrets/, ver P8/sealed-secrets/seal-secrets.sh.
