# Practica 10 -- Almacen de registros consultable (LogQL).
# Child Application del app-of-apps argocd/application-observabilidad.yaml.
# Multi-source: el chart viene del repositorio oficial (version fijada) y
# los values de ESTE repo (ref "values"), asi un cambio de configuracion es
# un commit revisable, nunca un `helm upgrade` a mano.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obs-loki
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.55.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/observabilidad/values/loki.yaml
    - repoURL: https://github.com/VR-Wilmer/sa-platform-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observabilidad
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
