# Practica 10 -- configuracion propia del stack: PodMonitor de los
# servicios, PrometheusRule de los SLO (registro + alertas), tablero de
# Grafana (ConfigMap que carga el sidecar) y el Secret sellado de Grafana.
# Depende de los CRDs que instala kube-prometheus-stack (PodMonitor,
# PrometheusRule): SkipDryRunOnMissingResource + retry cubren el primer
# sync, cuando esos CRDs todavia no existen.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obs-configuracion
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VR-Wilmer/sa-platform-gitops.git
    targetRevision: main
    path: observabilidad/manifests
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observabilidad
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
