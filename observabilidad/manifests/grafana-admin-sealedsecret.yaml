# Practica 10: credenciales de admin de Grafana (admin.existingSecret en
# observabilidad/values/kube-prometheus-stack.yaml), selladas con la llave
# del cluster sa-p10 -- mismo mecanismo que sealed-secrets/<ambiente>/.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin
  namespace: observabilidad
spec:
  encryptedData:
    admin-password: 
    admin-user: 
  template:
    metadata:
      name: grafana-admin
      namespace: observabilidad
