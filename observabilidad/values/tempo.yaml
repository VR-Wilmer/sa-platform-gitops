# Tempo (Practica 10): backend de trazas, modo single binary. Recibe OTLP
# del OpenTelemetry Collector (nunca directo de los servicios).
fullnameOverride: tempo

tempo:
  retention: 72h
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
  # metrics-generator: deriva el "service graph" (quien llama a quien, con
  # tasa y errores) a partir de las trazas y lo escribe en Prometheus. Es lo
  # que dibuja el mapa de servicios en Grafana.
  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://prometheus-operated.observabilidad.svc.cluster.local:9090/api/v1/write"
  overrides:
    defaults:
      metrics_generator:
        processors: [service-graphs]
  # 768Mi resulto insuficiente con el trafico del generador: Tempo era
  # terminado por OOMKill (exit 137) cada pocos minutos y perdia las trazas
  # recientes del WAL -- el recorrido sintoma->causa no encontraba la traza.
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "1", memory: 2Gi }

persistence:
  enabled: true
  size: 5Gi
